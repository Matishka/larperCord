name: Windows CI - Discord-synced Dock folders

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'build.zig'
      - 'tools/windows_deps.sh'

permissions:
  contents: read

jobs:
  windows-dock-folders:
    runs-on: windows-2025
    steps:
      - name: Checkout larperCord source
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install build utilities
        shell: pwsh
        run: choco install unzip zstandard -y --no-progress

      - name: Run Zig unit tests on Windows
        shell: pwsh
        run: zig build test

      - name: Download Windows libraries
        shell: pwsh
        run: bash tools/windows_deps.sh

      - name: Compile Windows app
        shell: pwsh
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item -Path 'zig-out\\bin\\*' -Destination $dist -Force

          $required = @('larpercord.exe', 'SDL3.dll', 'libcurl-x64.dll', 'libcrypto-3-x64.dll')
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $dist $file))) {
              throw "Required Windows build file is missing: $file"
            }
          }

          @'
          larperCord - Windows x64

          Extract all files into one folder and run larpercord.exe.
          Keep the DLL files beside the executable.
          Discord-synced Dock folders and drag-and-drop are included.
          '@ | Set-Content -Path (Join-Path $dist 'README-Windows.txt') -Encoding utf8

          $checksums = Get-ChildItem $dist -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: larperCord-Discord-Synced-Dock-Folders-Windows-PR
          path: dist/
          if-no-files-found: error
          retention-days: 14
