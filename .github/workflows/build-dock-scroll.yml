        run: bash tools/windows_deps.sh

      - name: Compile Windows app
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast

      - name: Upload build for download
        uses: actions/upload-artifact@v4
        with:
          name: larperCord-Cupertino-Dock-scroll-Windows
          path: zig-out/bin/*
          if-no-files-found: error
