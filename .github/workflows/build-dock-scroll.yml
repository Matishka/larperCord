
# Dock wheel scroll v2: corrected hunk location for the current src/ui/comp_rail.zig. Experimental.
name: Build larperCord Dock Scroll for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dock-scroll:
    runs-on: windows-2025
    steps:
      - name: Keep Zig source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout larperCord source
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install build utilities
        shell: pwsh
        run: choco install unzip -y --no-progress

