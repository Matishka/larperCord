# Dock wheel scroll v2: corrected hunk location for the current src/ui/comp_rail.zig. Experimental.
name: Build larperCord Dock Scroll for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dock-scroll:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout larperCord source
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates unzip zstd xz-utils tar git

