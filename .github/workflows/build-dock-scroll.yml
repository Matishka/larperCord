# Windows-only build for the Cupertino Dock scroll implementation.
name: Build larperCord Discord-Synced Dock Folders for Windows

on:
  push:
    branches: [main, feat/discord-synced-dock-folders]
    paths:
      - '.github/workflows/build-dock-scroll.yml'
      - 'src/ui/comp_rail.zig'
      - 'src/ui/state.zig'
      - 'src/ui/popup.zig'
      - 'src/ui/guild_folder_name.zig'
      - 'src/core/guild_layout.zig'
      - 'src/core/event.zig'
      - 'src/net/settings_proto.zig'
      - 'src/net/discord.zig'
      - 'src/net/fake_gateway.zig'
      - 'src/app.zig'
      - 'src/tests.zig'
      - 'tools/windows_deps.sh'
      - 'build.zig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dock-scroll:
    runs-on: windows-2025
    steps:
      - name: Keep Zig source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout larperCord source
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install build utilities
        shell: pwsh
        run: choco install unzip zstandard -y --no-progress

      - name: Run Zig unit tests on Windows
        shell: pwsh
        run: zig build test

      - name: Download Windows libraries
        shell: pwsh
        run: bash tools/windows_deps.sh

      - name: Compile Windows app
        shell: pwsh
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item -Path 'zig-out\bin\*' -Destination $dist -Force

          $required = @('larpercord.exe', 'SDL3.dll', 'libcurl-x64.dll', 'libcrypto-3-x64.dll')
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $dist $file))) {
              throw "Required Windows build file is missing: $file"
            }
          }

          @'
          larperCord — Windows x64

          1. Extract all files from this package into one folder.
          2. Keep larpercord.exe and all DLL files together.
          3. Run larpercord.exe.

          Cupertino Dock drag-and-drop, server folders and Discord account synchronization are included.
          SHA256SUMS contains hashes for the executable and DLL files.
          '@ | Set-Content -Path (Join-Path $dist 'README-Windows.txt') -Encoding utf8

          $checksums = Get-ChildItem $dist -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: larperCord-Discord-Synced-Dock-Folders-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
