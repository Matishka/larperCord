
# Windows-only build for the Cupertino Dock scroll implementation.
name: Build larperCord Dock Scroll for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dock-scroll.yml'
      - 'src/ui/comp_rail.zig'
      - 'src/ui/state.zig'
      - 'tools/windows_deps.sh'
      - 'build.zig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dock-scroll:
    runs-on: windows-2025
    steps:
      - name: Keep Zig source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout larperCord source
        uses: actions/checkout@v4

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install build utilities
        shell: pwsh
        run: choco install unzip zstandard -y --no-progress


      - name: Download Windows libraries
        shell: bash
        run: bash tools/windows_deps.sh

      - name: Compile Windows app
        shell: bash
        run: zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseFast

      - name: Upload build for download
        uses: actions/upload-artifact@v4
        with:
          name: larperCord-Cupertino-Dock-scroll-Windows
          path: zig-out/bin/*
          if-no-files-found: error
