name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "themes/**"
      - "src/**"
      - "build.zig"
      - "tools/gen_site.py"
      - "tools/web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static site on Windows
        shell: pwsh
        run: |
          # The optional WebAssembly demo is intentionally omitted in this Windows-only
          # workflow until its font-subsetting step supports Windows without fontconfig.
          Remove-Item -Recurse -Force docs/try, docs/pt/try -ErrorAction SilentlyContinue
          python tools/gen_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-2025
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
